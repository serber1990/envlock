[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "env-drift"
dynamic = ["version"]
description = "Freeze and compare Python, Node, and system environments — detect dependency drift before it breaks your builds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serber1990", email = "serber1990@pm.me" }]
requires-python = ">=3.9"
dependencies = ["shellcolorize>=1.1.0", "tomli>=1.1; python_version < '3.11'"]
keywords = ["environment", "dependencies", "drift", "reproducibility", "devops", "ci", "python", "node"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage   = "https://github.com/serber1990/envlock"
Repository = "https://github.com/serber1990/envlock"
Issues     = "https://github.com/serber1990/envlock/issues"
Changelog  = "https://github.com/serber1990/envlock/blob/main/CHANGELOG.md"

[project.scripts]
envlock = "envlock.cli:main"

[tool.setuptools.packages.find]
include = ["envlock*"]

[tool.setuptools.dynamic]
version = { attr = "envlock.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "B"]
